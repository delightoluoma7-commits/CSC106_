<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Planner</title>
  <style>
    body { font-family: Arial; padding: 20px; text-align: center; background: #f4f4f4; }
    nav a { margin: 0 10px; text-decoration: none; color: #0077cc; }
    .planner-box { background: white; max-width: 700px; margin: 20px auto; padding: 20px; border-radius: 12px; }
    input, button { padding: 10px; margin: 5px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #0077cc; color: white; border: none; cursor: pointer; }
    .course-chip { display: inline-block; background: #0077cc; color: white; padding: 8px 14px; border-radius: 20px; margin: 5px; cursor: pointer; font-weight: bold; }
    .course-chip.active { background: #ff9900; }
    .course-chip:hover { background: #005fa3; transform: scale(1.05); }
    ul { list-style: none; padding: 0; text-align: left; }
    li { background: #eef6ff; padding: 12px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .delete-btn { background: red; padding: 5px 10px; }
  </style>
</head>
<body>
  <header>
    <h1>My Academic Planner</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="planner.html">Planner</a>
    </nav>
  </header>

  <div class="planner-box">
    <h3>Add Task</h3>
    <input type="text" id="course" placeholder="Course e.g. CSC102">
    <input type="text" id="task" placeholder="Task e.g. Assignment">
    <input type="date" id="date">
    <button onclick="addTask()">Add</button>

    <div style="margin-top:20px;">
      <h3>My Courses (Click to Filter)</h3>
      <div id="courseList">No courses yet</div>
      <button onclick="showAll()" style="background:#666; margin-top:10px;">Show All Tasks</button>
    </div>

    <h3 style="margin-top:20px;">Tasks: <span id="filterName">All</span></h3>
    <ul id="taskList"></ul>
  </div>

<script>
let tasks = JSON.parse(localStorage.getItem("myPlanner")) || [];
let currentFilter = "All";

function addTask() {
  let course = document.getElementById("course").value.trim().toUpperCase();
  let task = document.getElementById("task").value.trim();
  let date = document.getElementById("date").value;
  if(!course || !task || !date) { alert("Fill all fields"); return; }
  
  tasks.push({course, task, date});
  localStorage.setItem("myPlanner", JSON.stringify(tasks));
  
  document.getElementById("course").value = "";
  document.getElementById("task").value = "";
  document.getElementById("date").value = "";
  
  displayCourses();
  displayTasks();
}

function displayCourses() {
  let courseDiv = document.getElementById("courseList");
  let uniqueCourses = [...new Set(tasks.map(t => t.course))];
  
  if(uniqueCourses.length === 0) {
    courseDiv.innerHTML = "No courses yet - add a task";
    return;
  }
  
  courseDiv.innerHTML = "";
  uniqueCourses.forEach(c => {
    let chip = document.createElement("span");
    chip.className = "course-chip" + (currentFilter === c ? " active" : "");
    chip.innerText = c;
    chip.onclick = () => filterCourse(c); // THIS MAKES IT CLICKABLE
    courseDiv.appendChild(chip);
  });
}

function filterCourse(courseName) {
  currentFilter = courseName;
  document.getElementById("filterName").innerText = courseName;
  displayCourses();
  displayTasks();
}

function showAll() {
  currentFilter = "All";
  document.getElementById("filterName").innerText = "All";
  displayCourses();
  displayTasks();
}

function displayTasks() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";
  
  let filtered = currentFilter === "All" ? tasks : tasks.filter(t => t.course === currentFilter);
  
  if(filtered.length === 0) {
    list.innerHTML = "<li>No tasks for " + currentFilter + "</li>";
    return;
  }
  
  filtered.forEach((t, i) => {
    // find real index for delete
    let realIndex = tasks.indexOf(t);
    let li = document.createElement("li");
    li.innerHTML = `<span><strong>${t.course}</strong> - ${t.task} <br><small>Due: ${t.date}</small></span>
                    <button class="delete-btn" onclick="deleteTask(${realIndex})">X</button>`;
    list.appendChild(li);
  });
}

function deleteTask(index) {
  tasks.splice(index, 1);
  localStorage.setItem("myPlanner", JSON.stringify(tasks));
  displayCourses();
  displayTasks();
  if(tasks.length === 0) showAll();
}

displayCourses();
displayTasks();
</script>
</body>
</html>
